name: test

# The tests are the only evidence this package offers, so they run on every push that could change the
# behaviour: the pure core, the delivery path against a stub attachments service, and the manifest
# contract that prevents the dual-package hazard (host packages must be peers, never dependencies).
#
# Windows is not decoration: this plugin's subject is the delivery path of screenshots on a desktop, and
# the file/PNG handling it exercises is the part most likely to be platform-sensitive.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to the current majors. The previous v4 actions ran on a deprecated Node 20 runtime that
      # GitHub was already force-upgrading, so every run carried a warning that had nothing to do with
      # this code.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: syntax
        run: node --check index.js && node --check lib/eye.js && node --check lib/grid.js && node --check lib/placement.js && node --check lib/png.js && node --check lib/resample.js
      - name: self-test (pure core)
        run: node test/selftest.mjs
      - name: end-to-end against a stub attachments service
        run: node test/e2e-stub.mjs
      - name: manifest contract
        run: node --test test/package-manifest.test.mjs
      - name: portable image and coordinate regressions
        run: node --test test/image-regression.test.mjs test/grid-regression.test.mjs
      - name: archived Luna localization scores still reproduce
        run: node experiments/luna/score.mjs --check
      # The published numbers must stay reproducible from the material shipped in experiments/. Without
      # this step the answers or truth.json could drift and the archive would keep printing something
      # plausible that no longer matches the reports. It checks integer counts exactly and pooled z to
      # 0.005, and it names every mismatch on failure.
      - name: published figures still reproduce
        run: node experiments/three-arm/rescore.mjs --check
      - name: the two L5 stimulus sets are the same image
        run: node experiments/three-arm/as-run/compare-stimuli.mjs
      # The placement claim in the README ("the default cuts where the picture is empty") is a measurement,
      # so it is re-measured here against the same materials rather than trusted.
      - name: the default placement still avoids slicing labels
        run: node experiments/seam-placement.mjs --check
